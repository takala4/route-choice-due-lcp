[project]
name = "due-lcp"
version = "0.1.0"
description = "Dynamic user equilibrium traffic assignment via linear complementarity (Wakui-Sakai-Akamatsu 2023), with an independent equilibrium checker and a UXsim comparison bridge"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Takara Sakai" }]
keywords = ["dynamic user equilibrium", "traffic assignment", "linear complementarity", "point queue", "UXsim"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11.0"]
uxsim = ["uxsim>=1.8"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/takara-sakai/due-lcp"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["due_lcp"]
