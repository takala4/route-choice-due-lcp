[project]
name = "route-choice-due-lcp"
version = "0.1.0"
description = "Route-choice dynamic user equilibrium (DUE) assignment on point-queue networks via linear complementarity (Wakui, Sakai and Akamatsu 2023), with an independent equilibrium checker and a UXsim comparison bridge"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Takara Sakai" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11.0"]
uxsim = ["uxsim>=1.8"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7", "jupyter", "nbconvert", "uxsim>=1.8"]

[project.urls]
Repository = "https://github.com/takala4/route-choice-due-lcp"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rcdue"]
