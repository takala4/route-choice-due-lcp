name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test (HiGHS backend; Gurobi tests are skipped without a licence)
        run: pytest -q
      - name: Execute example notebooks
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1200             --output-dir /tmp/nb examples/01_sequential_5node.ipynb examples/02_uxsim_fair_comparison.ipynb
